name: "Start NovaTech app"
description: "Builds the NovaTech Business Store and serves it on http://localhost:3000 for the rest of the job"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: app/package-lock.json

    - name: Build and start the app
      shell: bash
      working-directory: app
      run: |
        npm ci
        npm run build
        nohup npm start -- -p 3000 > "$RUNNER_TEMP/novatech-app.log" 2>&1 &
        for i in $(seq 1 30); do
          if curl -sf http://localhost:3000/ > /dev/null; then
            echo "NovaTech app is up on http://localhost:3000"
            exit 0
          fi
          sleep 2
        done
        echo "::error::app did not start within 60s"
        cat "$RUNNER_TEMP/novatech-app.log"
        exit 1
