name: "4 · Test Development"

# ─────────────────────────────────────────────────────────
# STLC Phase: Test Development
# Kane CLI:   testmd run (authoring mode)
#
# What it demonstrates:
#   - Agent authors each designed test in a real browser
#   - The test file is the documentation — steps, assertions,
#     and @verifies tags all in one place
#   - First run = authoring (agent figures out interactions)
#   - Subsequent runs = replay (fast, deterministic)
#
# What the prospect should notice:
#   - No SDET manually writes Selenium/Playwright scripts
#   - The agent works through the test file step by step
#   - Evidence is captured as the test runs
#
# Prerequisites:
#   Run workflows 1-3 first, and have the app deployed
# ─────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'URL of the NovaTech Business app to test against'
        required: true
        default: 'http://localhost:3000'
      test_file:
        description: 'Specific test file (blank = author all designed tests)'
        required: false
        default: ''
      max_tests:
        description: 'Max number of tests to author in this run'
        required: true
        default: '3'

env:
  LT_USERNAME: ${{ secrets.LT_USERNAME }}
  LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}

jobs:
  test-development:
    name: Author Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Kane CLI
        run: npm install -g @testmuai/kane-cli && kane-cli --version

      - name: Authenticate
        run: kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY"

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -f install -y
          google-chrome --version

      - name: Restore context graph and test files
        uses: actions/cache@v4
        with:
          path: |
            .context/
            .testmuai/
          key: context-tests-${{ hashFiles('docs/**') }}-${{ github.run_number }}
          restore-keys: |
            context-tests-${{ hashFiles('docs/**') }}-
            context-${{ hashFiles('docs/**') }}-

      # ── AUTHOR TESTS ───────────────────────────────────
      - name: "Author: Run designed tests in a real browser"
        run: |
          APP_URL="${{ inputs.app_url }}"
          MAX="${{ inputs.max_tests }}"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Test authoring"
          echo "  App URL: $APP_URL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ -n "${{ inputs.test_file }}" ]; then
            # Author a specific test
            echo "Authoring: ${{ inputs.test_file }}"
            kane-cli testmd run "${{ inputs.test_file }}" \
              --url "$APP_URL" \
              --headless \
              || echo "⚠️  Test authoring completed with issues"
          else
            # Author all designed tests (up to max)
            TESTS=$(find .testmuai/tests -name '*_test.md' 2>/dev/null | head -"$MAX")

            if [ -z "$TESTS" ]; then
              echo "⚠️  No test files found in .testmuai/tests/"
              echo "   Run workflow 3 (Test Design) first"
              exit 1
            fi

            TOTAL=$(echo "$TESTS" | wc -l | tr -d ' ')
            CURRENT=0

            for TEST in $TESTS; do
              CURRENT=$((CURRENT + 1))
              echo ""
              echo "── [$CURRENT/$TOTAL] Authoring: $(basename $TEST) ──"
              kane-cli testmd run "$TEST" \
                --url "$APP_URL" \
                --headless \
                || echo "⚠️  Authoring of $TEST completed with issues"
            done
          fi

      - name: "Result: Show authored test evidence"
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Authored test evidence"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ -d ".testmuai/evidence" ]; then
            find .testmuai/evidence -type f | head -20
          else
            echo "No evidence packs generated yet"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 4-test-development-${{ github.run_number }}
          retention-days: 30
          path: |
            .testmuai/
            .context/
